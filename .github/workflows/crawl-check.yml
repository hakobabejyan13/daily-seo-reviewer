name: crawl-check

# Manual run only: verifies the site in config.yaml can be crawled politely
# from GitHub Actions (robots.txt allows us, no bot challenge, sitemap OK).
# The dry-run step also calls PageSpeed Insights; it needs the repository
# secret PSI_API_KEY (without it PSI is recorded as failed, the run goes on)
# and uses GEMINI_API_KEY for the review summary (without it the report uses
# the template summary and says why).
# Telegram: by default the message is only built and printed (--no-deliver);
# tick "send_telegram" on Run workflow to send it for real (needs the
# repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID).
on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send the Telegram message (off = dry run, message only printed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl-check
  cancel-in-progress: false

jobs:
  crawl-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (no network)
        run: python -m pytest -q

      - name: Crawl check
        env:
          PYTHONPATH: src
        run: python -m seo_reviewer.crawl_check --config config.yaml --json crawl-check.json

      - name: Show full JSON result
        if: always()
        run: cat crawl-check.json || true

      - name: Collect + diff + summary + report + Telegram dry run (nothing is committed)
        if: always()
        env:
          PYTHONPATH: src
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NO_DELIVER: ${{ inputs.send_telegram && ' ' || '--no-deliver' }}
        run: python -m seo_reviewer.main --config config.yaml $NO_DELIVER

      - name: Show the report (also added to the run summary)
        if: always()
        run: |
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            cat "$f"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
