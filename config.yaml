# Daily SEO Reviewer configuration.
# Everything site-specific lives here; switching sites = editing this file only.
# Secrets are NOT stored here: they come from env vars (GitHub Secrets / .env).

site:
  name: "Cloudflare Blog"
  base_url: "https://blog.cloudflare.com"
  sitemap_url: "https://blog.cloudflare.com/sitemap.xml"
  # Fallback (switch only if the crawl check fails for the main site):
  #   name: "Smashing Magazine"
  #   base_url: "https://www.smashingmagazine.com"
  #   sitemap_url: "https://www.smashingmagazine.com/sitemap.xml"

crawler:
  user_agent: "daily-seo-reviewer/0.1 (+https://github.com/hakobabejyan13/daily-seo-reviewer)"
  requests_per_second: 1
  timeout_seconds: 20
  max_retries: 1
  respect_robots_txt: true
  max_pages: 50              # homepage + newest N sitemap URLs by lastmod
  extra_urls: []             # always-crawled pages, besides the homepage
  # Regexes on the URL path, used when picking the newest sitemap URLs
  # (not applied to the homepage or extra_urls). Empty = no filter.
  sitemap_include: []
  sitemap_exclude:           # tag/author pages and translations get a new lastmod with every post
    - "^/tag/"
    - "^/author/"
    - "^/[a-z]{2}-[a-z]{2}/"

sitemap:
  max_child_sitemaps: 20
  max_urls: 15000            # real site ~10,200 URLs (dry run 2026-11-08); headroom for growth

links:
  enabled: true
  max_links: 150             # ~1 req/s: 150 links ~2.5 min; crawl ~1 min; leaves room for PSI in the 5-min budget
  check_external: false
  method: "HEAD"             # GET fallback when HEAD is not allowed

psi:
  enabled: true
  api_key_env: "PSI_API_KEY"
  urls: []                   # empty = homepage only; add key URLs here
  strategies: ["mobile", "desktop"]
  timeout_seconds: 60
  max_retries: 1
  regression_confirmations: 2   # lab metrics only; CrUX compared directly

thresholds:
  title_length: {min: 30, max: 60}
  meta_description_length: {min: 70, max: 160}
  psi_performance_drop_points: 10
  sitemap_drop_percent: 10   # more than this share of sitemap URLs removed in one day = warning
  lab_tolerance:             # changes below these are treated as noise
    lcp_ms: 300
    cls: 0.02
    tbt_ms: 100

rules:
  # /x and /x/ count as the same URL when matching canonicals and links to pages
  # (Hakob, 2026-11-08). A canonical that differs only by that slash is one grouped info finding.
  trailing_slash_equivalent: true
  group_min: 5               # more than N findings with the same rule and change -> one grouped finding
  max_urls_per_finding: 50   # URL list cap inside a grouped finding
  severity_overrides: {}     # e.g. {title_length: warning}; rule ids are in src/seo_reviewer/rules.py

llm:
  enabled: true
  provider: "gemini"
  model: "gemini-3.5-flash-lite"  # pinned name, never a "latest" alias. Newest stable Flash-Lite (Google models page, 2026-11-08); gemini-3.8-flash timed out at 90 s, gemini-2.5-flash is closed to new keys (404)
  api_key_env: "GEMINI_API_KEY"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
  max_output_tokens: 2048    # includes thought tokens on Gemini 3+; the summary itself is ~150 tokens
  thinking_budget: null      # Gemini 2.5 only: 0 = thinking off. null for Gemini 3+.
  thinking_level: "low"      # Gemini 3+ only: low/medium/high (thinking cannot be off; thought tokens count against max_output_tokens)
  timeout_seconds: 90        # per call; cut to what is left of llm.budget_seconds. 60 s timed out on 2026-11-08
  budget_seconds: 180        # own window for the summary (both attempts), counted after the diff, not part of runtime.budget_seconds

delivery:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    parse_mode: "HTML"         # only HTML is supported; all text is HTML-escaped
    max_findings_in_message: 5
    timeout_seconds: 20        # per sendMessage call; 5xx/timeouts retried once, 429 only if retry_after <= 30 s
  report_dir: "reports"
  report_base_url: "https://github.com/hakobabejyan13/daily-seo-reviewer/blob/main/reports"

storage:
  snapshot_dir: "data/snapshots"
  retention_days: 90

runtime:
  budget_seconds: 300        # whole run must finish in <= 5 min
